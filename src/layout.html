<!doctype html>
<html lang="{{lang}}">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NH15M0PLGC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-NH15M0PLGC');
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <meta name="theme-color" content="#5b5bf6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e14" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="{{url}}">{{hreflang}}
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-friendly summary">

  <!-- Google AdSense site verification -->
  <meta name="google-adsense-account" content="ca-pub-3088214716790750">

  <!-- Open Graph / social -->
  <meta property="og:type" content="{{og_type}}">
  <meta property="og:site_name" content="CompressZone">
  <meta property="og:title" content="{{og_title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{og_image}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{og_title}}">
  <meta property="og:locale" content="{{og_locale}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{og_title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{og_image}}">

  <script type="application/ld+json">{{jsonld}}</script>

  <link rel="stylesheet" href="/css/styles.css">
  {{scripts}}
</head>
<body{{body_attrs}}>
  <a class="skip-link" href="#main">{{t_skip}}</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{home}}" aria-label="CompressZone home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="cz-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b5bf6"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#cz-g)"/><path d="M8.5 8.5 14 14m0-5v5H9M23.5 23.5 18 18m0 5v-5h5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="wordmark">Compress<b>Zone</b></span>
      </a>
{{nav}}
    </div>
  </header>

  <main id="main">
{{breadcrumbs}}{{content}}
  </main>

{{footer}}
{{after}}
  <noscript><p class="noscript">{{t_noscript}}</p></noscript>
</body>
</html>
