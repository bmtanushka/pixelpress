    <section class="container tool" aria-label="Compresor de imágenes">
      <label class="dropzone" id="dropzone" tabindex="0">
        <input type="file" id="file-input" accept="image/*,.heic,.heif,.avif" multiple hidden>
        <span class="dz-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0-4.5 4.5M12 4l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span class="dz-title">Suelta tus imágenes aquí o <u>elígelas</u></span>
        <span class="dz-sub">También puedes pegar con <kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>V</kbd> · JPG, PNG, WebP, HEIC, GIF, BMP, AVIF, SVG</span>
      </label>

      <div class="settings" role="group" aria-label="Ajustes de compresión">
        <div class="field">
          <span class="field-label" id="fmt-label">Formato de salida</span>
          <div class="segmented" role="radiogroup" aria-labelledby="fmt-label" id="format-group">
            <label><input type="radio" name="format" value="original" checked><span>Igual que el original</span></label>
            <label><input type="radio" name="format" value="image/webp"><span>WebP</span></label>
            <label><input type="radio" name="format" value="image/jpeg"><span>JPG</span></label>
            <label><input type="radio" name="format" value="image/png"><span>PNG</span></label>
            <label hidden id="avif-option"><input type="radio" name="format" value="image/avif"><span>AVIF</span></label>
          </div>
        </div>

        <div class="field field-quality">
          <div class="field-row">
            <label class="field-label" for="quality">Calidad</label>
            <output id="quality-out" for="quality">80%</output>
          </div>
          <input type="range" id="quality" min="10" max="100" step="1" value="80">
          <div class="presets quality-presets" role="group" aria-label="Calidad predefinida">
            <button type="button" data-q="60">Más pequeño</button>
            <button type="button" data-q="80" class="active">Equilibrado <small>(recomendado)</small></button>
            <button type="button" data-q="92">Alta calidad</button>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="resize">Tamaño máximo</label>
          <select id="resize">
            <option value="0" selected>Tamaño original</option>
            <option value="3840">3840 px (4K)</option>
            <option value="2560">2560 px</option>
            <option value="1920">1920 px (Full HD)</option>
            <option value="1280">1280 px</option>
            <option value="800">800 px</option>
            <option value="exact">Tamaño exacto (ancho × alto)…</option>
          </select>
        </div>

        <div class="field field-wide exact-panel" id="exact-panel" hidden>
          <div class="exact-row">
            <label class="mini-field"><span>Ancho</span><input type="number" id="exact-w" min="1" max="10000" inputmode="numeric" value="1080"></label>
            <span class="times" aria-hidden="true">×</span>
            <label class="mini-field"><span>Alto</span><input type="number" id="exact-h" min="1" max="10000" inputmode="numeric" value="1080"></label>
            <span class="unit">px</span>
            <label class="mini-field grow"><span>Ajuste</span>
              <select id="exact-fit">
                <option value="cover">Recortar para llenar</option>
                <option value="contain">Encajar (añadir márgenes)</option>
              </select>
            </label>
            <label class="mini-field grow"><span>Tamaños comunes</span>
              <select id="exact-preset">
                <option value="">Elegir…</option>
                <option value="600x600">Pasaporte / visa 2×2 in (600×600)</option>
                <option value="413x531">Pasaporte 35×45 mm (413×531)</option>
                <option value="1080x1080">Instagram cuadrado (1080×1080)</option>
                <option value="1080x1350">Instagram vertical (1080×1350)</option>
                <option value="1080x1920">Historia / Reel (1080×1920)</option>
                <option value="1280x720">Miniatura de YouTube (1280×720)</option>
                <option value="1200x630">Facebook / vista previa (1200×630)</option>
                <option value="1500x500">Cabecera de X / Twitter (1500×500)</option>
                <option value="1920x1080">Full HD (1920×1080)</option>
              </select>
            </label>
          </div>
        </div>

        <div class="field field-wide target-panel">
          <label class="switch"><input type="checkbox" id="target-on"><span class="switch-ui" aria-hidden="true"></span><span class="switch-label">Tamaño de archivo objetivo</span></label>
          <div class="target-row" id="target-row" hidden>
            <label class="mini-field"><span>Tamaño máximo</span><span class="kb-input"><input type="number" id="target-kb" min="5" max="50000" step="1" inputmode="numeric" value="100"><b>KB</b></span></label>
            <div class="presets" role="group" aria-label="Tamaños predefinidos">
              <button type="button" data-kb="20">20 KB</button>
              <button type="button" data-kb="50">50 KB</button>
              <button type="button" data-kb="100">100 KB</button>
              <button type="button" data-kb="200">200 KB</button>
              <button type="button" data-kb="500">500 KB</button>
              <button type="button" data-kb="1024">1 MB</button>
            </div>
            <p class="hint">La calidad se elige automáticamente: la más alta que cabe. Con objetivos muy pequeños también se pueden reducir las dimensiones.</p>
          </div>
        </div>
      </div>

      <div class="results" id="results" hidden>
        <div class="summary">
          <div class="summary-stats" aria-live="polite" id="summary-stats"></div>
          <div class="summary-actions">
            <button type="button" class="btn btn-ghost" id="clear-btn">Borrar</button>
            <button type="button" class="btn btn-primary" id="zip-btn" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0 4.5-4.5M12 15l-4.5-4.5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Descargar todo
            </button>
          </div>
        </div>
        <ul class="file-list" id="file-list"></ul>
      </div>
    </section>
